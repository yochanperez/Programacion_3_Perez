<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Fútbol - Cobertura del Trapecio Defensivo</title>
    <script src="dom13_trapecio_mp.js" defer></script>
</head>
<body>
    <h1>Estadísticas de Fútbol</h1>
    <h2>Cálculo de Área del Trapecio Defensivo</h2>

    <input id="baseMayor" type="number" placeholder="Ancho línea defensiva (m)">
    <input id="baseMenor" type="number" placeholder="Ancho línea de medios (m)">

    <input id="altura" type="number" placeholder="Distancia entre líneas (m)">

    <button id="btn_calculo_area" class="boton">
        Calcular Área Táctica
    </button>

    <div id="error"></div>

    <p id="resultado"></p>
</body>
</html>

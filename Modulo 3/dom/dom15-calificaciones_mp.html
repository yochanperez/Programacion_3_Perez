<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Registro de Rendimiento de Jugadores</title>
   <script src="dom15_calificaciones_mp.js" defer></script>
   <style>
       body {
           font-family: Arial, sans-serif;
           margin: 40px;
           background-color: #0f172a;
           color: #f8fafc;
       }

       h2 {
           color: #38bdf8;
           border-bottom: 2px solid #a855f7;
           padding-bottom: 6px;
       }

       .card {
           background: #1e293b;
           border: 1px solid #334155;
           border-radius: 8px;
           padding: 24px;
           max-width: 480px;
           box-shadow: 0 2px 6px rgba(0,0,0,0.3);
       }

       .fila-ingreso {
           display: flex;
           gap: 10px;
           align-items: center;
           margin-bottom: 14px;
       }

       .fila-ingreso input[type="text"] {
           flex: 2;
           padding: 7px 10px;
           border: 1px solid #475569;
           border-radius: 4px;
           font-size: 14px;
           background-color: #0f172a;
           color: #f8fafc;
       }

       .fila-ingreso input[type="number"] {
           flex: 1;
           padding: 7px 10px;
           border: 1px solid #475569;
           border-radius: 4px;
           font-size: 14px;
           background-color: #0f172a;
           color: #f8fafc;
       }

       .fila-ingreso input:focus {
           outline: none;
           border-color: #a855f7;
           box-shadow: 0 0 0 2px rgba(168,85,247,0.2);
       }

       .fila-ingreso label {
           font-size: 13px;
           color: #cbd5e1;
           white-space: nowrap;
       }

       .botones {
           display: flex;
           gap: 10px;
           margin-top: 4px;
       }

       button {
           padding: 9px 18px;
           border: none;
           border-radius: 4px;
           font-size: 14px;
           cursor: pointer;
       }

       .btn-agregar {
           background-color: #a855f7;
           color: white;
       }
       .btn-agregar:hover { background-color: #9333ea; }

       .btn-calcular {
           background-color: #0284c7;
           color: white;
           flex: 1;
       }
       .btn-calcular:hover { background-color: #0369a1; }

       .btn-limpiar {
           background-color: #64748b;
           color: white;
       }
       .btn-limpiar:hover { background-color: #475569; }

       .error {
           display: none;
           background: #7f1d1d;
           border: 1px solid #ef4444;
           color: #fca5a5;
           padding: 10px 14px;
           border-radius: 6px;
           margin-top: 12px;
           font-size: 14px;
       }

       #listaAlumnos {
           margin-top: 20px;
           max-width: 480px;
       }

       #listaAlumnos h3 {
           font-size: 14px;
           color: #cbd5e1;
           margin-bottom: 8px;
       }

       table {
           width: 100%;
           border-collapse: collapse;
           font-size: 14px;
           background: #1e293b;
           border-radius: 8px;
           overflow: hidden;
           box-shadow: 0 1px 4px rgba(0,0,0,0.3);
       }

       thead tr {
           background-color: #a855f7;
           color: white;
       }

       th, td {
           padding: 9px 14px;
           text-align: left;
           border-bottom: 1px solid #334155;
       }

       tbody tr:nth-child(even) { background-color: #0f172a; }

       .estado-aprobado { color: #4ade80; font-weight: bold; }
       .estado-reprobado { color: #fca5a5; font-weight: bold; }

       .btn-eliminar {
           background: none;
           border: none;
           color: #fca5a5;
           cursor: pointer;
           font-size: 16px;
           padding: 0 4px;
       }

       .estadisticas {
           display: none;
           background: #1e293b;
           border: 1px solid #334155;
           border-radius: 8px;
           padding: 20px 24px;
           margin-top: 20px;
           max-width: 480px;
           box-shadow: 0 2px 6px rgba(0,0,0,0.3);
       }

       .estadisticas h3 {
           margin: 0 0 14px;
           color: #38bdf8;
           font-size: 15px;
       }

       .grilla-stats {
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 12px;
       }

       .stat-box {
           border-radius: 8px;
           padding: 14px;
           text-align: center;
       }

       .stat-box .valor {
           font-size: 1.8em;
           font-weight: bold;
       }

       .stat-box .etiqueta {
           font-size: 12px;
           margin-top: 4px;
           opacity: 0.85;
       }

       .box-promedio  { background: #581c87; color: #f3e8ff; }
       .box-mayor     { background: #064e3b; color: #4ade80; }
       .box-menor     { background: #7f1d1d; color: #fca5a5; }
       .box-aprobados { background: #0c4a6e; color: #38bdf8; }
   </style>
</head>
<body>

   <h2>Registro de Rendimiento de Jugadores</h2>

   <div class="card">
       <div class="fila-ingreso">
           <label>Jugador:</label>
           <input type="text" id="inNombre" placeholder="Nombre del jugador">
           <label>Rendimiento:</label>
           <input type="number" id="inNota" placeholder="0–10" min="0" max="10" step="0.01">
           <button class="btn-agregar" onclick="agregarAlumno()">+</button>
       </div>

       <div class="botones">
           <button class="btn-calcular" onclick="calcularEstadisticas()">Calcular rendimiento</button>
           <button class="btn-limpiar"  onclick="limpiar()">Limpiar todo</button>
       </div>

       <div class="error" id="error"></div>
   </div>

   <div id="listaAlumnos" style="display:none">
       <h3>Jugadores evaluados</h3>
       <table>
           <thead>
               <tr>
                   <th>#</th>
                   <th>Jugador</th>
                   <th>Puntaje</th>
                   <th>Evaluación</th>
                   <th></th>
               </tr>
           </thead>
           <tbody id="tablaBody"></tbody>
       </table>
   </div>

   <div class="estadisticas" id="estadisticas">
       <h3>Métricas del plantel</h3>
       <div class="grilla-stats">
           <div class="stat-box box-promedio">
               <div class="valor" id="sPromedio"></div>
               <div class="etiqueta">Rendimiento promedio</div>
           </div>
           <div class="stat-box box-mayor">
               <div class="valor" id="sMayor"></div>
               <div class="etiqueta">Puntaje más alto</div>
           </div>
           <div class="stat-box box-menor">
               <div class="valor" id="sMenor"></div>
               <div class="etiqueta">Puntaje más bajo</div>
           </div>
           <div class="stat-box box-aprobados">
               <div class="valor" id="sAprobados"></div>
               <div class="etiqueta">Aptos / Total plantel</div>
           </div>
       </div>
   </div>

</body>
</html>

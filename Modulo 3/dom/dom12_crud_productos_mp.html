<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Fútbol - CRUD de Plantilla</title>
    <script src="dom12_crud_productos_mp.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .formulario {
            background-color: #eef4fb;
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }
        .formulario input {
            margin: 5px;
            padding: 8px;
            width: 200px;
        }
        .btn_agregar:hover {
            background-color: #4CAF50;
            color: white;
        }
        #stats {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 15px;
            flex: 1;
            min-width: 180px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
        }
        .stat-card p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Gestión de Plantilla y Rendimiento</h1>
    <h2>CRUD de Jugadores y Valor de Mercado</h2>
    <div class="formulario">
        <h3>Agregar Nuevo Jugador</h3>
        <label for="nombre">Jugador:</label>
        <input id="nombre" type="text" placeholder="Nombre del jugador">
        <label for="descripcion">Posición:</label>
        <input id="descripcion" type="text" placeholder="Ej: MCD, DFC, DC">
        <label for="precio">Valor ($M):</label>
        <input id="precio" type="number" placeholder="Valor en millones">
        <button id="btn_agregar" class="btn_agregar">Agregar Jugador</button>
        <button id="btn_cancelar" class="btn_cancelar">Cancelar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Jugador</th>
                <th>Posición</th>
                <th>Valor ($M)</th>
                <th>ACCIONES</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    <div id="stats">
        <div class="stat-card">
            <h3>Total Jugadores</h3>
            <p id="stat_total">0</p>
        </div>
        <div class="stat-card">
            <h3>Valor Promedio</h3>
            <p id="stat_promedio">$0.00M</p>
        </div>
        <div class="stat-card">
            <h3>Jugador Más Valioso</h3>
            <p id="stat_caro">-</p>
        </div>
        <div class="stat-card">
            <h3>Jugador Menos Valioso</h3>
            <p id="stat_barato">-</p>
        </div>
    </div>

</body>
</html>

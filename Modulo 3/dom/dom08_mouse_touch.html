<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización del DOM</title>
    <script src="dom08_mouse_touch.js" defer></script>
</head>
<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>Evento Mouse touch</h2>
    <h2>Circulo</h2>

    <h2>Evento Mouse Move</h2>

    <div id="contenedorTriangulo" style="position:relative; width:100%; height:300px; margin-top:20px; background:whitesmoke;">
   <div id="triangulo" style="
       width: 0;
       height: 0;
       border-left: 50px solid transparent;
       border-right: 50px solid transparent;
       border-bottom: 100px solid crimson;
       position: absolute;
       top: 100px;
       left: calc(50% - 50px);
       transition: transform 0.2s ease;">
   </div>
</div>

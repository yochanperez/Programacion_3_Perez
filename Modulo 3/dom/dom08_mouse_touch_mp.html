<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Fútbol - Bloque Defensivo</title>
    <script src="dom08_mouse_touch_mp.js" defer></script>
</head>
<body>
    <h1 id="titulo">Panel de Control Táctico</h1>
    <h2>Análisis de Presión y Escala Defensiva</h2>
    <h2>Densidad en Área Rival</h2>

    <h2>Ajuste de Bloque Táctico</h2>

    <div id="contenedorTriangulo" style="position:relative; width:100%; height:300px; margin-top:20px; background:#1e293b; border-radius: 8px;">
        <div id="triangulo" style="
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid #22c55e;
            position: absolute;
            top: 100px;
            left: calc(50% - 50px);
            transition: transform 0.2s ease;">
        </div>
    </div>
    
</body>
</html>

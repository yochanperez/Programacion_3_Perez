<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>

    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label form="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                </td>
            </tr>
             <tr>
                <td>
                   <label > Correo electronico
            <input type="email" id="email" name="email">
                    </label>
                </td>
            </tr>
            
            <tr>
               <td>
                <label form="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono">
               </td> 
            </tr>
            <tr>
               <td>
                <label form="url">Sitio Web</label>
                <input type="url" id="url" name="url">
               </td> 
            </tr>
            <tr>
               <td>
                <label form="buscar">Buscar</label>
                <input type="search" id="buscar" name="buscar">
               </td> 
            </tr>
            <tr>
               <td>
                <label form="password">Contraseña</label>
                <input type="password" id="password" name="password">
               </td> 
            </tr>
            <!--Tipo Numericos-->
             <tr>
               <td>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="0" max="120" step="1"><br>
               </td> 
               <td>
                <label form="volumen">Volumen<span id="val-vol">50</span><br></label>
                <input type="range" id="volumen" name="volumen" min="0" max="100" value="50" oninput="document.getElementById('val-vol').textContent=this.value">
                <button type="submit">Enviar</button>
               </td>
            </tr>

           

            

        </table>
    </form>
</body>
</html>

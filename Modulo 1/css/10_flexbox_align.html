<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>align-items</title>
  <link rel="stylesheet" href="10_flexbox_align.css">


</head>
<body>

   <h1>Flexbox Align Items</h1>

   <h2>flex-start (inicio)</h2>
  <h2>stretch (default)</h2>
  <div class="contenedor stretch">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <h2>flex-start</h2>
  <div class="contenedor inicio">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <h2>flex-end</h2>
  <div class="contenedor fin">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <h2>center</h2>
  <div class="contenedor centro">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <h2>baseline</h2>
  <div class="contenedor baseline">
    <div class="item">Texto</div>
    <div class="item">Texto más grande</div>
    <div class="item">Texto gigante</div>
  </div>

</body>
</html>

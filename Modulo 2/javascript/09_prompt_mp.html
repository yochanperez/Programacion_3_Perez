<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutData - Captura en Navegador</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2.5rem;
      text-align: center;
    }
    .panel-alerta {
      background-color: #1f2937;
      border: 1px solid #374151;
      padding: 2rem;
      border-radius: 8px;
      display: inline-block;
      max-width: 500px;
      margin-top: 2rem;
    }
    h1 {
      color: #e63946;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #9ca3af;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="panel-alerta">
    <h1>Análisis Técnico en Navegador</h1>
    <p>El script interactivo se ejecutará de forma inmediata en la ventana emergente de la pantalla.</p>
  </div>

  <script>
    const jugador = prompt("Ingrese el nombre del futbolista analizado:");
    const tirosTexto = prompt(`Cantidad de tiros totales realizados por ${jugador}:`);
    const golesTexto = prompt(`Cantidad de goles anotados por ${jugador}:`);

    const tiros = parseInt(tirosTexto, 10);
    const goles = parseInt(golesTexto, 10);

    if (isNaN(tiros) || isNaN(goles) || tiros <= 0) {
      alert("Error: Las métricas ingresadas en la ventana emergente no son válidas.");
    } else {
      const efectividad = (goles / tiros) * 100;
      
      alert(`⚽ REPORTE DE RENDIMIENTO\n\nJugador: ${jugador}\nEfectividad de Remates: ${efectividad.toFixed(1)}%\nEstatus: Datos consolidados en la UI.`);
    }
  </script>

</body>
</html>
